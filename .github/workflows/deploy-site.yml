name: Deploy Site

on:
  workflow_run:
    workflows: ["Security Scan"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  check:
    if: |
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      ) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      should_deploy: ${{ steps.changes.outputs.site == 'true' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
    steps:
      # audit-only: logs egress but does not block it (same for every
      # harden-runner step in this file).
      # TODO: switch to egress-policy: block with allowed-endpoints list later.
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Diff against the first parent: on a merge commit this is exactly what
      # the PR brought into main. paths-filter does not fit here - under
      # workflow_run it falls back to `git log -1 --name-status`, which returns
      # no files for a merge commit.
      - name: Detect site changes
        id: changes
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          if git diff --quiet "$SHA^1" "$SHA" -- site/ .github/workflows/deploy-site.yml; then
            echo "site=false" >> "$GITHUB_OUTPUT"
          else
            echo "site=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check
    if: needs.check.outputs.should_deploy == 'true'
    environment: production
    env:
      DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
    name: Sync S3 + invalidate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # audit-only: logs egress but does not block it (same for every
      # harden-runner step in this file).
      # TODO: switch to egress-policy: block with allowed-endpoints list later.
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create deterministic archive + manifest
        run: |
          find site -type f | LC_ALL=C sort | tar --mtime='UTC 2020-01-01' --owner=0 --group=0 -czf site.tar.gz -T -
          find site -type f -exec sha256sum {} \; | LC_ALL=C sort | tee manifest.sha256
          sha256sum -c manifest.sha256
          sha256sum site.tar.gz

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: site.tar.gz

      - name: Verify attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh attestation verify site.tar.gz \
            --repo "$REPO" \
            --signer-workflow "$REPO/.github/workflows/deploy-site.yml" \
            --deny-self-hosted-runners

      - name: Extract for sync
        run: tar xzf site.tar.gz

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Preview sync (dryrun)
        run: |
          aws s3 sync site/ "s3://rr-djuikoo-site" --delete --dryrun --no-progress \
            > preview.txt && cat preview.txt

      - name: Sync site to S3 (assets, 1h cache)
        run: |
          aws s3 sync site/ "s3://rr-djuikoo-site" --delete --no-progress \
            --exclude "index.html" \
            --cache-control "public, max-age=3600"

      - name: Upload index.html (no-cache)
        run: |
          aws s3 cp site/index.html "s3://rr-djuikoo-site/index.html" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html; charset=utf-8"

      - name: Verify S3 integrity
        run: |
          set -euo pipefail
          while IFS= read -r line; do
            sha=$(echo "$line" | awk '{print $1}')
            path=$(echo "$line" | awk '{print $2}')
            key=${path#site/}
            etag=$(aws s3api head-object --bucket rr-djuikoo-site --key "$key" \
              --query ETag --output text | tr -d '"')
            if echo "$etag" | grep -q "-"; then
              echo "multipart ETag for $key ($etag), skipping strict MD5 check"
              continue
            fi
            local_md5=$(md5sum "$path" | awk '{print $1}')
            if [ "$local_md5" != "$etag" ]; then
              echo "mismatch $key local MD5 $local_md5 != ETag $etag"
              exit 1
            fi
            echo "verified $key"
          done < manifest.sha256
          echo "All S3 objects verified"

      - name: Invalidate CloudFront
        run: |
          id=$(aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" --paths "/*" \
            --query Invalidation.Id --output text)
          echo "Invalidation $id"
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION_ID" --id "$id"
