name: Security Scan

on:
  pull_request:
    branches: [main]

  # Merging a PR pushes to main: this trigger re-runs the scans on the merge
  # result and produces the workflow_run that `Deploy Site` waits for.
  push:
    branches: [main]

permissions: {}

# Cancel any previous running workflow for the
# same branch/PR when a new commit is pushed
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sca:
    name: Trivy scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      # audit-only: logs egress but does not block it (same for every
      # harden-runner step in this file).
      # TODO: switch to egress-policy: block with allowed-endpoints list later.
      - name: Harden runner
        uses: step-security/harden-runner@v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22

      # Trivy scans package-lock.json, but the browser runs site/js/main.js.
      # If a lockfile bump isn't followed by `npm run build:js`, Trivy reports
      # a fixed version while the bundled bytes are still vulnerable. This
      # also catches Dependabot PRs, which bump the lockfile via the GitHub
      # API and never trigger pre-commit, so the rebuild never happens.
      - name: Verify JS bundle alignment
        run: |
          npm ci
          npm run build:js
          git diff --exit-code site/js/main.js

      # Gate: fails the job on HIGH/CRITICAL findings only. The SARIF
      # run below still reports every severity (LOW to CRITICAL), so
      # lower-severity findings are never silently ignored.
      - name: Run Trivy (gate on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      # Audit-only: generates a SARIF with all findings (LOW to
      # CRITICAL) so the full audit is available even when the gate
      # above fails on HIGH/CRITICAL.
      - name: Run Trivy (SARIF, all severities)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: sarif
          output: trivy.sarif
          severity: LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 0

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4.37.3
        with:
          sarif_file: trivy.sarif
          category: trivy

  sast:
    name: Semgrep scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Cache Semgrep venv
        uses: actions/cache@v6.1.0
        with:
          path: /tmp/semgrep-venv
          key: semgrep-venv-${{ runner.os }}-1.172.0

      - name: Install Semgrep
        run: |
          if ! /tmp/semgrep-venv/bin/semgrep --version 2>/dev/null | grep -q "1.172.0"; then
            rm -rf /tmp/semgrep-venv
            python3 -m venv /tmp/semgrep-venv
            /tmp/semgrep-venv/bin/pip install --upgrade pip
            /tmp/semgrep-venv/bin/pip install semgrep==1.172.0
          fi
          /tmp/semgrep-venv/bin/semgrep --version

      # Gate: fails the job on HIGH/CRITICAL (Semgrep ERROR) findings.
      - name: Run Semgrep
        run: /tmp/semgrep-venv/bin/semgrep --config=p/ci --sarif --output=semgrep.sarif --error --severity ERROR .

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4.37.3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  secrets:
    name: Gitleaks scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Gate: fails the job if a secret is found.
      # GITLEAKS_LICENSE is not required on a personal account.
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  iac:
    name: Checkov scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Detect infra changes
        uses: dorny/paths-filter@v4.0.3
        id: changes
        with:
          filters: |
            infra:
              - 'terraform/**'

      # Gate: fails the job on HIGH/CRITICAL findings.
      - name: Run Checkov
        if: steps.changes.outputs.infra == 'true'
        uses: bridgecrewio/checkov-action@v12.3116.0
        with:
          directory: terraform
          framework: terraform
          config_file: .checkov.yml
          quiet: true
          soft_fail: false
          hard_fail_on: HIGH,CRITICAL
          output_format: cli,sarif
          output_file_path: console,checkov.sarif

      - name: Upload SARIF
        if: steps.changes.outputs.infra == 'true' && (success() || failure())
        uses: github/codeql-action/upload-sarif@v4.37.3
        with:
          sarif_file: checkov.sarif
          category: checkov
