# Checkov config: assumed skips for the bootstrap state bucket.
# NOTE: global skips on terraform/ — re-evaluate when terraform/main.tf
# adds the site bucket: logging/replication might become relevant.

framework: terraform
quiet: true

skip-check:
  # Single-region by design (us-east-1 everywhere)
  - CKV_AWS_144

  # No S3 event workflow on the state bucket, no security value.
  - CKV2_AWS_62

  # Low forensic risk: private bucket, non-listable, write access restricted to me only.
  - CKV_AWS_18

  # AES256 (SSE-S3) assumed, free, sufficient as long as the state holds no secrets.
  # KMS CMK = ~$1/month + policy maintenance, to reconsider if secrets are stored in state.
  - CKV_AWS_145

  # Ephemeral session data with low recovery business value; disabled to minimize
  # ongoing AWS storage costs.
  - CKV_AWS_28

  # Synchronous Lambda (Function URL RESPONSE_STREAM): errors are returned
  # directly to the client, no async message to replay via DLQ.
  - CKV_AWS_116

  # X-Ray tracing on Lambda deferred - infra-only stub, no downstream Bedrock/DynamoDB
  # tracing needed yet.
  # NOTE: Decision to be revisited once app is functional and observability justifies
  # cost/overhead.
  - CKV_AWS_50

  # Public personal site - no geo restriction needed.
  - CKV_AWS_374
