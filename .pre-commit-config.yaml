repos:
  # General
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict

  # Prettier
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: f12edd9c7be1c20cfa42420fd0e6df71e42b51ea
    hooks:
      - id: prettier
        types_or: [yaml, json, markdown]
        # Generated by scripts/build-site.mjs; let the generator own its format.
        exclude: ^site/content\.json$

  # Terraform (terraform/)
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: bf9dd9c695ddaf238af36f179049202358ec22b7
    hooks:
      - id: terraform_fmt
        files: ^terraform/
      - id: terraform_validate
        files: ^terraform/
        args:
          - --init-args=-backend=false
      - id: terraform_tflint
        files: ^terraform/
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl

  # Secrets
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks

  # Generated site artefacts
  - repo: local
    hooks:
      - id: build-site
        name: rebuild site/ from src/profile.mjs
        entry: node scripts/build-site.mjs
        language: system
        pass_filenames: false
        files: ^(src/|scripts/build-site\.mjs$|site/index\.html$|site/content\.json$)
